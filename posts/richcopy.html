<style>
/* ------------------------------------------------------------------ *
 * Design tokens — единственный источник правды для цвета, ритма и форм.
 * Ни одно значение ниже не должно задаваться мимо этих переменных.
 * ------------------------------------------------------------------ */
:root {
  color-scheme: dark;

  /* Поверхности */
  --c-bg:             #0B0F0D;
  --c-surface:        #111614;
  --c-surface-raised: #161D1A;
  --c-surface-sunken: #0D1211;
  --c-border:         #1E2724;
  --c-border-strong:  #2A3733;

  /* Текст */
  --c-text:           #E7EDEA;
  --c-text-muted:     #8A9793;

  /* Бренд и семантика */
  --c-accent:         #009938;
  --c-accent-hi:      #00B845;
  --c-accent-lo:      #007C2D;
  --c-accent-ink:     #FFFFFF;
  --c-success:        #3DD68C;
  --c-error:          #F2555A;

  /* Тонированные подложки на базе акцента */
  --c-accent-wash:    rgba(0, 153, 56, 0.14);
  --c-accent-edge:    rgba(0, 153, 56, 0.24);
  --c-hairline-wash:  rgba(255, 255, 255, 0.03);
  --c-stripe:         rgba(255, 255, 255, 0.022);

  /* Шкала отступов — 8px */
  --sp-half: 4px;
  --sp-1:  8px;
  --sp-2: 16px;
  --sp-3: 24px;
  --sp-4: 32px;
  --sp-5: 40px;
  --sp-6: 48px;
  --sp-8: 64px;

  /* Радиусы */
  --r-sm:  8px;
  --r-md: 12px;
  --r-lg: 16px;

  /* Типографика */
  --fs-xs:   12px;
  --fs-sm:   13px;
  --fs-base: 15px;
  --fs-md:   17px;
  --fs-lg:   21px;
  --fs-xl:   28px;

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Движение */
  --dur: 150ms;
  --ease: cubic-bezier(0.2, 0.6, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Атмосфера: мягкий акцентный вымыв сверху, без резких градиентов. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(880px 380px at 50% -12%, rgba(0, 153, 56, 0.13), transparent 68%),
    radial-gradient(560px 300px at 108% 4%, rgba(0, 153, 56, 0.05), transparent 70%);
}

::selection { background: var(--c-accent-edge); color: var(--c-text); }

:focus-visible {
  outline: 2px solid var(--c-accent-hi);
  outline-offset: 2px;
}

/* ------------------------------------------------------------------ *
 * Каркас
 * ------------------------------------------------------------------ */
.shell {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: var(--sp-8) var(--sp-3) var(--sp-8);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.masthead { margin-bottom: var(--sp-1); }

.masthead__title {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  margin: 0 0 var(--sp-1);
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: -0.022em;
}

.masthead__mark {
  width: 12px;
  height: 12px;
  flex: none;
  border-radius: 3px;
  background: var(--c-accent);
  box-shadow: 0 0 0 4px rgba(0, 153, 56, 0.12);
}

.masthead__lede {
  margin: 0;
  max-width: 70ch;
  color: var(--c-text-muted);
  font-size: var(--fs-sm);
  line-height: 1.65;
}

.panel {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.panel--preview { background: var(--c-surface-raised); }

.panel__label {
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--c-text-muted);
}

/* ------------------------------------------------------------------ *
 * Поле ввода
 * ------------------------------------------------------------------ */
.editor {
  display: block;
  width: 100%;
  min-height: 260px;
  resize: vertical;
  padding: var(--sp-2);
  background: var(--c-surface-sunken);
  color: var(--c-text);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.65;
  tab-size: 2;
  transition: border-color var(--dur) var(--ease);
}

.editor::placeholder { color: var(--c-text-muted); }
.editor:focus { outline: none; border-color: var(--c-accent); }
.editor:focus-visible { outline: 2px solid var(--c-accent-hi); outline-offset: 2px; }

/* ------------------------------------------------------------------ *
 * Кнопки
 * ------------------------------------------------------------------ */
.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1);
}

.btn {
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  padding: 12px 18px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--c-text);
  cursor: pointer;
  white-space: nowrap;
  transition:
    background-color var(--dur) var(--ease),
    border-color var(--dur) var(--ease),
    color var(--dur) var(--ease);
}

.btn--primary { background: var(--c-accent); color: var(--c-accent-ink); }
.btn--primary:hover { background: var(--c-accent-hi); }
.btn--primary:active { background: var(--c-accent-lo); }

.btn--secondary { border-color: var(--c-border); }
.btn--secondary:hover { border-color: var(--c-border-strong); background: var(--c-hairline-wash); }

.btn--ghost { border-color: transparent; }
.btn--ghost:hover { border-color: var(--c-border); background: var(--c-hairline-wash); }

.hint {
  margin-left: auto;
  color: var(--c-text-muted);
  font-size: var(--fs-xs);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-half);
}

.hint kbd {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1;
  padding: 4px 6px;
  border: 1px solid var(--c-border-strong);
  border-radius: 5px;
  background: var(--c-surface-sunken);
  color: var(--c-text);
}

/* ------------------------------------------------------------------ *
 * Статус
 * ------------------------------------------------------------------ */
.status {
  margin: 0;
  min-height: 1.5em;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
  color: var(--c-text-muted);
  transition: color 260ms var(--ease);
}

.status[data-tone="ok"]    { color: var(--c-success); }
.status[data-tone="error"] { color: var(--c-error); }

/* ------------------------------------------------------------------ *
 * Предпросмотр — рендер произвольного HTML, отдельная визуальная зона
 * ------------------------------------------------------------------ */
.preview {
  padding: var(--sp-3);
  background: var(--c-surface-sunken);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  overflow-wrap: anywhere;
}

.preview:empty::before {
  content: "Пусто — вставьте HTML выше.";
  color: var(--c-text-muted);
  font-size: var(--fs-sm);
}

.preview :where(h2, h4, p, table, details, footer, blockquote, ul, ol, img) {
  margin: 0 0 var(--sp-2);
}
.preview > :last-child,
.preview details > :last-child { margin-bottom: 0; }

.preview h2 {
  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
}

.preview h4 {
  margin-top: var(--sp-3);
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: 1.35;
  color: var(--c-text);
}
.preview > h4:first-child { margin-top: 0; }

.preview p { font-size: 14px; line-height: 1.65; }

.preview a {
  color: var(--c-success);
  text-decoration: none;
  border-bottom: 1px solid rgba(61, 214, 140, 0.35);
}
.preview a:hover { border-bottom-color: var(--c-success); }

.preview code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  padding: 2px 6px;
  border: 1px solid var(--c-accent-edge);
  border-radius: 6px;
  background: var(--c-accent-wash);
  color: var(--c-text);
}

.preview img {
  display: block;
  max-width: 100%;
  height: auto;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  background: var(--c-hairline-wash);
}

.preview table {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-sm);
  overflow: hidden;
  font-size: 14px;
}

.preview th,
.preview td {
  padding: 10px 12px;
  border: 1px solid var(--c-border-strong);
  text-align: left;
  vertical-align: top;
}

.preview th {
  background: var(--c-hairline-wash);
  font-weight: 600;
  color: var(--c-text);
}

.preview tr:nth-child(even) td { background: var(--c-stripe); }

.preview details {
  padding: var(--sp-2);
  border: 1px solid var(--c-border-strong);
  border-left: 2px solid var(--c-accent);
  border-radius: var(--r-md);
  background: var(--c-hairline-wash);
}

.preview summary {
  margin-bottom: var(--sp-1);
  font-weight: 600;
  font-size: 14px;
  list-style: none;
  cursor: default;
}
.preview summary::-webkit-details-marker { display: none; }

.preview hr {
  height: 0;
  border: 0;
  border-top: 1px solid var(--c-border-strong);
  margin: var(--sp-3) 0;
}

.preview footer {
  font-size: var(--fs-sm);
  color: var(--c-text-muted);
}

.preview tg-emoji {
  border-bottom: 1px dotted var(--c-accent-edge);
}

@media (max-width: 560px) {
  .shell { padding: var(--sp-5) var(--sp-2) var(--sp-6); }
  .panel { padding: var(--sp-2); }
  .btn { flex: 1 1 auto; }
  .hint { margin-left: 0; width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<script type="text/plain" id="payload-flow">
<img src="https://raw.githubusercontent.com/enkinvsh/dropweb-channel/main/posts/assets/flow-studio-hero.png"/><h2><tg-emoji emoji-id="5444968063931817207">🆕</tg-emoji> Flow.Studio — студия промптов для картинок <tg-emoji emoji-id="5442899912624744398">💚</tg-emoji></h2><p>Нейросеть рисует ровно то, что вы попросили. Беда в том, что попросить одной строкой почти невозможно: «парень у мотоцикла под дождём» — и модель каждый раз сама додумывает за вас свет, оптику, одежду и фон. Получается лотерея.</p><p>Мы собрали <b>Flow.Studio</b> — конструктор, который превращает идею в строгий JSON из семи секций. Вы правите ровно то, что хотели, остальное остаётся на месте. Работает в браузере, ставить ничего не нужно: <a href="https://flow.dropweb.org">flow.dropweb.org</a>.</p><h4><tg-emoji emoji-id="5443066630370274694">🧩</tg-emoji> Семь секций вместо одной строки</h4><p>Персонаж, одежда, аксессуары, окружение, поза, свет и настроение, камера и оптика. Каждая секция отдельно, любую можно выключить одним тумблером.</p><p>Внутри 186 готовых подсказок — объектив 85mm f/1.4, кинематографичный контровой свет, готика Rick Owens, мокрый асфальт с отражениями неона. Клик по подсказке подставляет её в поле. Любую можно переписать под себя или добавить свою.</p><h4><tg-emoji emoji-id="5442752114210156135">✨</tg-emoji> AI-ассистент внутри</h4><p>Напишите мысль одной фразой и нажмите «Развернуть» — студия соберёт полный кадр по всем семи секциям.</p><p>Дальше правьте словами: «сделай свет темнее», «замени машину на Porsche 911». Меняется только то, о чём попросили, — остальные секции остаются нетронутыми. А если идеи кончились, есть «Умный AI-рандом»: студия придумает сцену за вас.</p><h4><tg-emoji emoji-id="5442648197476428669">📌</tg-emoji> Закрепы — рамка для рандома</h4><p>Любую подсказку можно закрепить, и тогда она уходит в каждый запрос. Закрепили «персонаж — мужчина» и «только тотал-блэк» — рандом крутится внутри вашей рамки, а не вместо неё.</p><h4><tg-emoji emoji-id="5442798946533553490">🎭</tg-emoji> Подобрать образ по фото</h4><p>Загрузите портрет — студия прочитает внешность: тон волос, подтон кожи, черты лица. И соберёт под неё образ: типаж, гардероб, аксессуары.</p><p>Окружение, свет и камера при этом остаются вашими — образ меняется, кадр не рассыпается.</p><h4><tg-emoji emoji-id="5442916327989749260">🧹</tg-emoji> Клинер изображений</h4><p>Готовую картинку можно прогнать через клинер. Он вычищает метаданные и служебные манифесты генераторов — EXIF, XMP, IPTC, C2PA — и снимает невидимую спектральную метку, которую туда кладёт нейросеть.</p><p>Сначала можно просто посмотреть, что внутри файла: режим осмотра показывает все найденные метки, ничего не меняя.</p><h4><tg-emoji emoji-id="5443112655239815282">🗂</tg-emoji> Библиотека и общая галерея</h4><p>Шаблоны и подсказки живут в вашем аккаунте — открыли студию с другого устройства, всё на месте. Удачный кадр можно опубликовать в общую галерею, а чужой — забрать к себе и переделать под свой вкус.</p><p>Референсные картинки остаются только в вашем браузере, на сервер мы их не забираем.</p><hr/><h4><tg-emoji emoji-id="5444967239298096727">🔑</tg-emoji> Десять кодов для вас</h4><p>Студия закрытая — вход только по коду. Для канала мы выделили десять: один код — одна регистрация, кто успел, тот и в студии.</p><p>Откройте <a href="https://flow.dropweb.org">flow.dropweb.org</a>, вкладка «Регистрация», вставьте свободный код и придумайте логин с паролем. Логин — латиницей, пароль — от 10 символов.</p><p><code>FLOW-JEWK-CV2W-R4GC</code><br/><code>FLOW-6J3S-EW3F-QHAY</code><br/><code>FLOW-JAW8-F284-KC3E</code><br/><code>FLOW-4HSQ-GEAE-VQMW</code><br/><code>FLOW-YWFY-QRZY-C36T</code><br/><code>FLOW-QEPP-8TZX-RNKW</code><br/><code>FLOW-SN5E-ZFNG-YQ3C</code><br/><code>FLOW-2ZT9-G5KG-APYF</code><br/><code>FLOW-A5W5-2YMD-HWNY</code><br/><code>FLOW-UXEW-7HM2-ZGZN</code></p><p>Код не подошёл — значит, его уже забрали. Напишите нам, добавим ещё.</p><hr/><p>Flow.Studio · <a href="https://flow.dropweb.org">flow.dropweb.org</a> · вопросы — в <a href="https://t.me/dropwebpay_bot">бота поддержки</a></p>
</script>

<script>
(() => {
  'use strict';

  const IDLE_STATUS = 'Готов к работе.';
  const STATUS_RESET_MS = 4500;
  const RENDER_DEBOUNCE_MS = 150;
  const CHARSET_PREFIX = '<meta charset="utf-8">';

  const srcEl = document.getElementById('src');
  const previewEl = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const payloadEl = document.getElementById('payload');

  const dropwebPost = payloadEl.textContent.trim();
  const flowPost = document.getElementById('payload-flow').textContent.trim();

  let statusTimer = 0;
  let renderTimer = 0;

  /* --------------------------------------------------------------- *
   * Статус
   * --------------------------------------------------------------- */
  const setStatus = (text, tone) => {
    statusEl.textContent = text;
    statusEl.dataset.tone = tone;
    window.clearTimeout(statusTimer);
    if (text !== IDLE_STATUS) {
      statusTimer = window.setTimeout(() => {
        statusEl.textContent = IDLE_STATUS;
        statusEl.dataset.tone = 'neutral';
      }, STATUS_RESET_MS);
    }
  };

  const countMatches = (haystack, pattern) => (haystack.match(pattern) || []).length;

  const describe = (html) => {
    const parts = [];
    const emoji = countMatches(html, /<tg-emoji emoji-id=/g);
    const details = countMatches(html, /<details/g);
    const tables = countMatches(html, /<table/g);

    if (emoji > 0) { parts.push(emoji + ' tg-emoji'); }
    if (details > 0) { parts.push(details + ' details'); }
    if (tables > 0) { parts.push(tables + ' table'); }

    const size = html.length + ' симв.';
    return parts.length > 0 ? size + ' · ' + parts.join(', ') : size;
  };

  /* --------------------------------------------------------------- *
   * Основной путь копирования: синхронное событие copy.
   * Не требует разрешений и работает из file://.
   * --------------------------------------------------------------- */
  function copyAsHtml(html) {
    const onCopy = (e) => {
      e.clipboardData.setData('text/html', html);
      e.clipboardData.setData('text/plain', html);
      e.preventDefault();
    };
    const ta = document.createElement('textarea');
    ta.value = ' ';
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.addEventListener('copy', onCopy);
    let ok = false;
    try { ok = document.execCommand('copy'); } finally {
      document.removeEventListener('copy', onCopy);
      ta.remove();
    }
    return ok;
  }

  /* Запасной путь: асинхронный Clipboard API с обоими флейворами. */
  const copyViaClipboardApi = async (html) => {
    if (!navigator.clipboard || typeof navigator.clipboard.write !== 'function') {
      throw new Error('Clipboard API недоступен');
    }
    if (typeof window.ClipboardItem !== 'function') {
      throw new Error('ClipboardItem не поддерживается');
    }
    const item = new window.ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([html], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
  };

  const handleCopy = async () => {
    const source = srcEl.value.trim();

    if (source === '') {
      setStatus('Нечего копировать — поле пустое.', 'error');
      srcEl.focus();
      return;
    }

    const clipboardHtml = CHARSET_PREFIX + source;

    if (copyAsHtml(clipboardHtml)) {
      setStatus('Скопировано · ' + describe(source), 'ok');
      return;
    }

    try {
      await copyViaClipboardApi(clipboardHtml);
      setStatus('Скопировано через Clipboard API · ' + describe(source), 'ok');
    } catch (err) {
      const reason = err && err.message ? err.message : String(err);
      setStatus('Не удалось скопировать: ' + reason, 'error');
    }
  };

  /* --------------------------------------------------------------- *
   * Предпросмотр
   * --------------------------------------------------------------- */
  const render = () => {
    previewEl.innerHTML = srcEl.value;
    const collapsibles = previewEl.querySelectorAll('details');
    for (const node of collapsibles) {
      node.setAttribute('open', '');
    }
  };

  const scheduleRender = () => {
    window.clearTimeout(renderTimer);
    renderTimer = window.setTimeout(render, RENDER_DEBOUNCE_MS);
  };

  /* --------------------------------------------------------------- *
   * Привязки
   * --------------------------------------------------------------- */
  document.getElementById('btn-copy').addEventListener('click', handleCopy);

  document.getElementById('btn-load').addEventListener('click', () => {
    srcEl.value = dropwebPost;
    render();
    setStatus('Загружен пост dropweb proxy · ' + describe(dropwebPost), 'ok');
    srcEl.focus();
  });

  document.getElementById('btn-load-flow').addEventListener('click', () => {
    srcEl.value = flowPost;
    render();
    setStatus('Загружен пост Flow.Studio · ' + describe(flowPost), 'ok');
    srcEl.focus();
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    srcEl.value = '';
    render();
    setStatus('Поле очищено.', 'neutral');
    srcEl.focus();
  });

  srcEl.addEventListener('input', scheduleRender);

  srcEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      handleCopy();
    }
  });

  render();
})();
</script>

</body>
</html>
